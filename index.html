<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAQ CRM</title>
<style>
  :root{
    --bg:#f5f6fa; --panel:#ffffff; --border:#e3e6ee; --text:#1c2333; --muted:#6b7280;
    --primary:#4f46e5; --primary-dark:#4338ca; --primary-light:#eef2ff;
    --green:#16a34a; --green-light:#dcfce7;
    --amber:#d97706; --amber-light:#fef3c7;
    --red:#dc2626; --red-light:#fee2e2;
    --blue:#2563eb; --blue-light:#dbeafe;
    --purple:#9333ea; --purple-light:#f3e8ff;
    --gray:#6b7280; --gray-light:#f1f2f6;
    --radius:10px;
    --shadow:0 1px 3px rgba(20,20,43,0.06), 0 1px 2px rgba(20,20,43,0.04);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0;flex-shrink:0;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:10px;padding:0 20px 16px;font-weight:700;font-size:18px;color:var(--primary);border-bottom:1px solid var(--border);margin-bottom:10px;}
  .brand-badge{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#818cf8);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;color:var(--muted);cursor:pointer;font-size:14px;font-weight:500;border-left:3px solid transparent;}
  .nav-item:hover{background:var(--gray-light);color:var(--text);}
  .nav-item.active{background:var(--primary-light);color:var(--primary);border-left-color:var(--primary);}
  .nav-icon{width:18px;text-align:center;}
  .nav-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--muted);opacity:0.7;padding:14px 20px 4px;}
  .sidebar-footer{margin-top:auto;padding:14px 20px 0;border-top:1px solid var(--border);}
  .btn-ghost-sm{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 0;}
  .btn-ghost-sm:hover{color:var(--red);}

  /* Main */
  .main{flex:1;padding:26px 32px;overflow-x:hidden;max-width:100%;}
  .page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:22px;font-weight:700;margin:0;}
  .page-subtitle{color:var(--muted);font-size:13px;margin-top:4px;}

  .btn{background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{background:var(--primary-dark);}
  .btn-secondary{background:var(--panel);color:var(--text);border:1px solid var(--border);}
  .btn-secondary:hover{background:var(--gray-light);}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;}
  .btn-danger{background:var(--red);}
  .btn-danger:hover{background:#b91c1c;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;padding:4px 6px;border-radius:6px;}
  .icon-btn:hover{background:var(--gray-light);color:var(--text);}

  input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);width:100%;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light);}
  label{font-size:12px;font-weight:600;color:var(--muted);display:block;margin-bottom:5px;}
  .field{margin-bottom:14px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--muted);}
  .checkbox-row input{width:auto;}
  .form-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:var(--primary);margin:20px 0 12px;padding-top:14px;border-top:1px solid var(--border);}
  .form-section-title:first-child{margin-top:0;padding-top:0;border-top:none;}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .search-box{position:relative;flex:1;min-width:200px;max-width:320px;}
  .search-box input{padding-left:32px;}
  .search-box::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;opacity:0.5;}

  /* Cards / stats */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
  .stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .stat-label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
  .stat-value{font-size:26px;font-weight:700;margin-top:6px;}
  .stat-sub{font-size:12px;color:var(--muted);margin-top:4px;}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
  .panel + .panel{margin-top:20px;}
  .panel-title{font-size:15px;font-weight:700;margin:0 0 14px;}
  .dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start;}
  @media (max-width:900px){.dash-grid{grid-template-columns:1fr;}}

  /* Table */
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--gray-light);cursor:pointer;}
  .empty-row td{text-align:center;color:var(--muted);padding:36px;cursor:default;white-space:normal;}
  .empty-row:hover td{background:none;}

  .avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0;}
  .name-cell{display:flex;align-items:center;gap:10px;}
  .sub-text{font-size:12px;color:var(--muted);}
  .badge{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:700;white-space:nowrap;}
  .badge-green{background:var(--green-light);color:var(--green);}
  .badge-amber{background:var(--amber-light);color:var(--amber);}
  .badge-red{background:var(--red-light);color:var(--red);}
  .badge-blue{background:var(--blue-light);color:var(--blue);}
  .badge-purple{background:var(--purple-light);color:var(--purple);}
  .badge-gray{background:var(--gray-light);color:var(--gray);}

  /* Kanban */
  .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
  .kanban-col{background:#eef0f6;border-radius:var(--radius);min-width:240px;width:240px;flex-shrink:0;display:flex;flex-direction:column;max-height:calc(100vh - 200px);}
  .kanban-col-header{padding:12px 14px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid;white-space:nowrap;}
  .kanban-col-body{padding:10px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:10px;min-height:60px;}
  .kanban-col-body.drag-over{background:#e0e3f0;}
  .kanban-card{background:#fff;border-radius:8px;padding:12px;box-shadow:var(--shadow);cursor:grab;border:1px solid var(--border);}
  .kanban-card:active{cursor:grabbing;}
  .kanban-card.dragging{opacity:0.4;}
  .kanban-card-title{font-weight:600;font-size:13px;margin-bottom:6px;}
  .kanban-card-sub{font-size:11px;color:var(--muted);margin-bottom:6px;}
  .kanban-card-meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,20,43,0.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal-header{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border);}
  .modal-header h3{margin:0;font-size:16px;}
  .modal-body{padding:20px 22px;}
  .modal-footer{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .modal-footer-right{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;}
  .close-x{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);}
  .close-x:hover{color:var(--text);}

  .detail-section{margin-bottom:18px;}
  .detail-label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:0.03em;margin-bottom:8px;}
  .activity-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .activity-item:last-child{border-bottom:none;}
  .activity-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:5px;flex-shrink:0;}
  .activity-time{font-size:11px;color:var(--muted);}
  .task-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
  .task-row:last-child{border-bottom:none;}
  .task-row.done .task-title{text-decoration:line-through;color:var(--muted);}
  .task-title{flex:1;font-size:13px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state-icon{font-size:36px;margin-bottom:10px;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--text);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.2);z-index:200;opacity:0;transform:translateY(8px);transition:all 0.2s;}
  .toast.show{opacity:1;transform:translateY(0);}

  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;}
  .bar-label{width:110px;flex-shrink:0;color:var(--muted);font-weight:600;}
  .bar-track{flex:1;background:var(--gray-light);border-radius:6px;height:18px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;border-radius:6px;background:var(--primary);transition:width 0.4s;}
  .bar-value{width:36px;text-align:right;flex-shrink:0;font-weight:700;}

  .link{color:var(--primary);cursor:pointer;font-weight:600;}
  .link:hover{text-decoration:underline;}

  .auth-wrap{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;}
  .auth-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:32px;width:100%;max-width:360px;}
  .auth-error{background:var(--red-light);color:var(--red);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------------- Supabase client ---------------- */
const SUPABASE_URL = 'https://flbzcafkbypexdgfujqm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsYnpjYWZrYnlwZXhkZ2Z1anFtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4MDczMjYsImV4cCI6MjEwMzM4MzMyNn0.lRaIhw68JB3zq7-YML0Kfv4qh3EQAoh6CVFHKFAC1qM';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------- Reference data (mirrors the ClickUp Sales pipeline) ---------------- */
const OPPORTUNITY_TYPES = [
  {id:'new', label:'New'}, {id:'replacement', label:'Replacement'}, {id:'upgrade', label:'Upgrade'},
  {id:'aftersales', label:'Aftersales'}, {id:'services', label:'Services'},
];
const PRIORITIES = [
  {id:'urgent', label:'Urgent'}, {id:'high', label:'High'}, {id:'normal', label:'Normal'}, {id:'low', label:'Low'},
];
const WIN_LOSE = [
  {id:'pending', label:'Pending', badge:'badge-gray'},
  {id:'won', label:'Won', badge:'badge-green'},
  {id:'lost', label:'Lost', badge:'badge-red'},
];
const PAYMENT_TERMS = ['LC','CAD','Advance'];
const CURRENCIES = ['USD','Euro','PKR'];
const LC_STATUSES = [
  {id:'not_applicable', label:'N/A', badge:'badge-gray'},
  {id:'pending', label:'Pending', badge:'badge-amber'},
  {id:'done', label:'Done', badge:'badge-green'},
];
const SIMPLE_STATUSES = [
  {id:'pending', label:'Pending', badge:'badge-amber'},
  {id:'done', label:'Done', badge:'badge-green'},
];
const LEAD_SOURCES = [{id:'referral', label:'Referral'}, {id:'existing_customer', label:'Existing Customer'}];
const FOLLOW_UP_ACTIONS = [
  {id:'email_follow_up', label:'Email Follow-Up'}, {id:'phone_call', label:'Phone Call'},
  {id:'schedule_meeting', label:'Schedule Meeting'}, {id:'send_proposal', label:'Send Proposal'}, {id:'send_reminder', label:'Send Reminder'},
];
const COMMISSION_STATUSES = [
  {id:'pending', label:'Pending'}, {id:'processed', label:'Processed'}, {id:'completed', label:'Completed'},
  {id:'failed', label:'Failed'}, {id:'refunded', label:'Refunded'},
];
const LEAD_COLUMNS = [
  {id:'to_do', label:'To Do', color:'#6b7280'},
  {id:'in_progress', label:'In Progress', color:'#2563eb'},
  {id:'qualified', label:'Qualified', color:'#16a34a'},
  {id:'not_qualified', label:'Not Qualified', color:'#dc2626'},
  {id:'not_now', label:'Not Now', color:'#9333ea'},
];
const RFQ_COLUMNS = [
  {id:'not_started', label:'Not Started', color:'#dc2626'},
  {id:'in_progress', label:'In Progress', color:'#2563eb'},
  {id:'awaiting_response', label:'Awaiting Response', color:'#d97706'},
  {id:'not_interested', label:'Not Interested', color:'#9333ea'},
  {id:'won', label:'Won (drop to promote)', color:'#16a34a'},
];
const PAYMENT_COLUMNS = [
  {id:'receivable', label:'Receivable', color:'#dc2626'},
  {id:'in_progress', label:'In Progress', color:'#2563eb'},
  {id:'received', label:'Received', color:'#16a34a'},
];

/* ---------------- State ---------------- */
let state = {profiles:[], customers:[], principals:[], contacts:[], opportunities:[], opportunityPrincipals:[], tasks:[], activities:[]};
let view = 'dashboard';
let searchQuery = '';
let modal = null; // {type, id}
let dragCardId = null;

let session = null;
let authChecked = false;
let authError = '';
let authLoading = false;
let dataLoaded = false;

/* ---------------- Auth & data bootstrap ---------------- */
function mapProfileFromDb(r){ return {id:r.id, email:r.email||'', fullName:r.full_name||r.email||''}; }
function mapCustomerFromDb(r){ return {id:r.id, name:r.name, industry:r.industry||'', website:r.website||'', notes:r.notes||''}; }
function mapPrincipalFromDb(r){ return {id:r.id, name:r.name, notes:r.notes||''}; }
function mapContactFromDb(r){ return {id:r.id, name:r.name, email:r.email||'', phone:r.phone||'', title:r.title||'', customerId:r.customer_id||'', notes:r.notes||'', createdAt: r.created_at ? new Date(r.created_at).getTime() : Date.now()}; }
function mapTaskFromDb(r){ return {id:r.id, title:r.title, dueDate: r.due_date ? new Date(r.due_date+'T00:00:00').getTime() : null, done:!!r.done, contactId:r.contact_id||'', opportunityId:r.opportunity_id||'', notes:r.notes||''}; }
function mapActivityFromDb(r){ return {id:r.id, contactId:r.contact_id||'', opportunityId:r.opportunity_id||'', type:r.type, note:r.note, timestamp: r.created_at ? new Date(r.created_at).getTime() : Date.now()}; }
function mapOpportunityFromDb(r){
  return {
    id:r.id, pipelineStage:r.pipeline_stage||'rfq',
    customerId:r.customer_id||'', projectName:r.project_name||'', itemProduct:r.item_product||'', assignedTo:r.assigned_to||'',
    leadStatus:r.lead_status||'to_do', leadSource:r.lead_source||'', leadScore:r.lead_score,
    opportunityType:r.opportunity_type||'', opportunityNumber:r.opportunity_number||'',
    rfqNumber:r.rfq_number||'', rfqDate: r.rfq_date ? new Date(r.rfq_date+'T00:00:00').getTime() : null, rfqDateEstimated:!!r.rfq_date_estimated,
    oemReferenceNumber:r.oem_reference_number||'', priority:r.priority||'',
    followUpAction:r.follow_up_action||'', contactMethod:r.contact_method||'', rfqStatus:r.rfq_status||'not_started',
    winLose:r.win_lose||'pending', loseReason:r.lose_reason||'',
    ctrNumber:r.ctr_number||'', poNumber:r.po_number||'', poDate: r.po_date ? new Date(r.po_date+'T00:00:00').getTime() : null, poDateEstimated:!!r.po_date_estimated,
    currency:r.currency||'', poValue:Number(r.po_value)||0, paymentTerms:r.payment_terms||'', poPrincipalId:r.po_principal_id||'',
    lcStatus:r.lc_status||'pending', shipmentStatus:r.shipment_status||'pending',
    saleDate: r.sale_date ? new Date(r.sale_date+'T00:00:00').getTime() : null, paymentStatus:r.payment_status||'receivable',
    commissionStatus:r.commission_status||'', commissionRate:r.commission_rate,
    notes:r.notes||'', createdAt: r.created_at ? new Date(r.created_at).getTime() : Date.now()
  };
}

function upsertLocal(collection, item){
  const arr = state[collection];
  const idx = arr.findIndex(x=>x.id===item.id);
  if(idx>-1) arr[idx] = item; else arr.push(item);
}
function removeLocal(collection, id){
  state[collection] = state[collection].filter(x=>x.id!==id);
}

async function loadAllData(){
  const [pf, cu, pr, ct, op, opr, ta, ac] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('customers').select('*').order('name'),
    sb.from('principals').select('*').order('name'),
    sb.from('contacts').select('*').order('created_at', {ascending:false}),
    sb.from('opportunities').select('*').order('created_at', {ascending:false}),
    sb.from('opportunity_principals').select('*'),
    sb.from('tasks').select('*'),
    sb.from('activities').select('*'),
  ]);
  state.profiles = (pf.data||[]).map(mapProfileFromDb);
  state.customers = (cu.data||[]).map(mapCustomerFromDb);
  state.principals = (pr.data||[]).map(mapPrincipalFromDb);
  state.contacts = (ct.data||[]).map(mapContactFromDb);
  state.opportunities = (op.data||[]).map(mapOpportunityFromDb);
  state.opportunityPrincipals = (opr.data||[]).map(r=>({opportunityId:r.opportunity_id, principalId:r.principal_id}));
  state.tasks = (ta.data||[]).map(mapTaskFromDb);
  state.activities = (ac.data||[]).map(mapActivityFromDb);
}

async function reloadOpportunityPrincipals(){
  const {data} = await sb.from('opportunity_principals').select('*');
  state.opportunityPrincipals = (data||[]).map(r=>({opportunityId:r.opportunity_id, principalId:r.principal_id}));
}

function applyRealtimeChange(collection, mapFn, payload){
  if(payload.eventType === 'DELETE'){ removeLocal(collection, payload.old.id); }
  else { upsertLocal(collection, mapFn(payload.new)); }
  render();
}

function subscribeRealtime(){
  sb.channel('crm-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'profiles'}, p=>applyRealtimeChange('profiles', mapProfileFromDb, p))
    .on('postgres_changes', {event:'*', schema:'public', table:'customers'}, p=>applyRealtimeChange('customers', mapCustomerFromDb, p))
    .on('postgres_changes', {event:'*', schema:'public', table:'principals'}, p=>applyRealtimeChange('principals', mapPrincipalFromDb, p))
    .on('postgres_changes', {event:'*', schema:'public', table:'contacts'}, p=>applyRealtimeChange('contacts', mapContactFromDb, p))
    .on('postgres_changes', {event:'*', schema:'public', table:'opportunities'}, p=>applyRealtimeChange('opportunities', mapOpportunityFromDb, p))
    .on('postgres_changes', {event:'*', schema:'public', table:'opportunity_principals'}, async ()=>{ await reloadOpportunityPrincipals(); render(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, p=>applyRealtimeChange('tasks', mapTaskFromDb, p))
    .on('postgres_changes', {event:'*', schema:'public', table:'activities'}, p=>applyRealtimeChange('activities', mapActivityFromDb, p))
    .subscribe();
}

async function bootstrap(){
  await loadAllData();
  subscribeRealtime();
  dataLoaded = true;
  render();
}

sb.auth.getSession().then(({data})=>{
  session = data.session;
  authChecked = true;
  if(session) bootstrap(); else render();
});
sb.auth.onAuthStateChange((event, sess)=>{
  session = sess;
  authChecked = true;
  if(session && !dataLoaded){ bootstrap(); }
  else if(!session){ dataLoaded=false; state={profiles:[],customers:[],principals:[],contacts:[],opportunities:[],opportunityPrincipals:[],tasks:[],activities:[]}; render(); }
});

/* ---------------- Helpers ---------------- */
function fmtMoney(n, currency){ return (currency?currency+' ':'$') + Number(n||0).toLocaleString(); }
function fmtDate(ts){ if(!ts) return '—'; return new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function initials(name){ return (name||'?').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function customerName(id){ const c = state.customers.find(x=>x.id===id); return c? c.name : '—'; }
function principalName(id){ const p = state.principals.find(x=>x.id===id); return p? p.name : '—'; }
function contactName(id){ const c = state.contacts.find(x=>x.id===id); return c? c.name : '—'; }
function profileName(id){ const p = state.profiles.find(x=>x.id===id); return p? p.fullName : '—'; }
function opportunityLabel(id){ const o = state.opportunities.find(x=>x.id===id); return o? (o.projectName || o.opportunityNumber || 'Opportunity') : '—'; }
function typeLabel(id){ const t = OPPORTUNITY_TYPES.find(x=>x.id===id); return t? t.label : '—'; }
function priorityLabel(id){ const p = PRIORITIES.find(x=>x.id===id); return p? p.label : '—'; }
function winLoseInfo(id){ return WIN_LOSE.find(x=>x.id===id) || WIN_LOSE[0]; }
function lcStatusInfo(id){ return LC_STATUSES.find(x=>x.id===id) || LC_STATUSES[1]; }
function simpleStatusInfo(id){ return SIMPLE_STATUSES.find(x=>x.id===id) || SIMPLE_STATUSES[0]; }
function opportunityPrincipalIds(oppId){ return state.opportunityPrincipals.filter(x=>x.opportunityId===oppId).map(x=>x.principalId); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ---------------- Render root ---------------- */
function render(){
  const app = document.getElementById('app');
  if(!authChecked){ app.innerHTML = `<div class="auth-wrap"><div class="sub-text">Loading…</div></div>`; return; }
  if(!session){ app.innerHTML = renderLogin(); attachAuthHandlers(); return; }
  if(!dataLoaded){ app.innerHTML = `<div class="auth-wrap"><div class="sub-text">Loading your CRM…</div></div>`; return; }
  app.innerHTML = `${renderSidebar()}<div class="main">${renderView()}</div>${modal ? renderModal() : ''}`;
  attachGlobalHandlers();
}

function renderLogin(){
  return `
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand" style="border:none;justify-content:center;margin-bottom:6px;"><div class="brand-badge">M</div> MAQ CRM</div>
      <div class="sub-text" style="text-align:center;margin-bottom:20px;">Sign in with the account your admin invited you with</div>
      ${authError ? `<div class="auth-error">${esc(authError)}</div>` : ''}
      <form id="login-form">
        <div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div>
        <div class="field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>
        <button class="btn" type="submit" style="width:100%;justify-content:center;" ${authLoading?'disabled':''}>${authLoading?'Signing in…':'Sign In'}</button>
      </form>
      <div class="sub-text" style="text-align:center;margin-top:16px;">Don't have an account? Ask your admin to invite you from the Supabase dashboard.</div>
    </div>
  </div>`;
}

function attachAuthHandlers(){
  const form = document.getElementById('login-form');
  if(!form) return;
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(form);
    authLoading = true; authError=''; render();
    const {error} = await sb.auth.signInWithPassword({email:fd.get('email').trim(), password:fd.get('password')});
    authLoading = false;
    if(error){ authError = error.message; render(); }
  });
}

function renderSidebar(){
  const pipelineItems = [
    {id:'leads', icon:'🌱', label:'Leads'},
    {id:'opportunities', icon:'📋', label:'RFQs / Opportunities'},
    {id:'orders', icon:'📦', label:'Orders & POs'},
    {id:'payments', icon:'💵', label:'Payment Tracker'},
  ];
  const otherItems = [
    {id:'customers', icon:'🏢', label:'Customers'},
    {id:'principals', icon:'🏭', label:'Principals'},
    {id:'contacts', icon:'👤', label:'Contacts'},
    {id:'tasks', icon:'✅', label:'Tasks'},
  ];
  const navItem = i => `<div class="nav-item ${view===i.id?'active':''}" data-nav="${i.id}"><span class="nav-icon">${i.icon}</span> ${i.label}</div>`;
  return `
  <div class="sidebar">
    <div class="brand"><div class="brand-badge">M</div> MAQ CRM</div>
    <div class="nav-item ${view==='dashboard'?'active':''}" data-nav="dashboard"><span class="nav-icon">📊</span> Dashboard</div>
    <div class="nav-group-label">Sales Pipeline</div>
    ${pipelineItems.map(navItem).join('')}
    <div class="nav-group-label">Records</div>
    ${otherItems.map(navItem).join('')}
    <div class="sidebar-footer">
      <div class="sub-text" style="margin-bottom:8px;word-break:break-all;">${esc(session.user.email)}</div>
      <button class="btn-ghost-sm" data-action="sign-out">Sign out</button>
    </div>
  </div>`;
}

function renderView(){
  switch(view){
    case 'dashboard': return renderDashboard();
    case 'leads': return renderLeads();
    case 'opportunities': return renderOpportunities();
    case 'orders': return renderOrders();
    case 'payments': return renderPayments();
    case 'customers': return renderCustomers();
    case 'principals': return renderPrincipals();
    case 'contacts': return renderContacts();
    case 'tasks': return renderTasks();
    default: return '';
  }
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(){
  const leads = state.opportunities.filter(o=>o.pipelineStage==='lead');
  const openLeads = leads.filter(o=>!['not_qualified','not_now'].includes(o.leadStatus));
  const rfqs = state.opportunities.filter(o=>o.pipelineStage==='rfq');
  const openRfqs = rfqs.filter(o=>o.winLose==='pending');
  const won = state.opportunities.filter(o=>o.winLose==='won');
  const lost = state.opportunities.filter(o=>o.winLose==='lost');
  const wonValue = won.reduce((s,o)=>s+Number(o.poValue||0),0);
  const orders = state.opportunities.filter(o=>o.pipelineStage==='order');
  const actionNeeded = orders.filter(o=>o.lcStatus==='pending' || o.shipmentStatus==='pending');
  const receivable = orders.filter(o=>o.paymentStatus!=='received');
  const receivableValue = receivable.reduce((s,o)=>s+Number(o.poValue||0),0);

  const openTasks = state.tasks.filter(t=>!t.done);
  const overdueTasks = openTasks.filter(t=>t.dueDate && t.dueDate < Date.now());
  const recentActivities = [...state.activities].sort((a,b)=>b.timestamp-a.timestamp).slice(0,6);
  const upcomingTasks = [...openTasks].sort((a,b)=>(a.dueDate||0)-(b.dueDate||0)).slice(0,6);

  const maxCount = Math.max(1, openLeads.length, openRfqs.length, orders.length, receivable.length);
  const funnelBars = [
    {label:'Leads', count:openLeads.length, color:'#9333ea'},
    {label:'Open RFQs', count:openRfqs.length, color:'#2563eb'},
    {label:'Orders', count:orders.length, color:'#d97706'},
    {label:'Awaiting Payment', count:receivable.length, color:'#dc2626'},
  ];

  return `
  <div class="page-header"><div><h1 class="page-title">Dashboard</h1><div class="page-subtitle">Leads → RFQ → Order → Payment, at a glance</div></div></div>

  <div class="stat-grid">
    <div class="stat-card"><div class="stat-label">Open Leads</div><div class="stat-value">${openLeads.length}</div><div class="stat-sub">${leads.length} total</div></div>
    <div class="stat-card"><div class="stat-label">Open RFQs</div><div class="stat-value">${openRfqs.length}</div><div class="stat-sub">${won.length} won · ${lost.length} lost</div></div>
    <div class="stat-card"><div class="stat-label">Won Value</div><div class="stat-value">${fmtMoney(wonValue)}</div><div class="stat-sub">${won.length} order${won.length!==1?'s':''}</div></div>
    <div class="stat-card"><div class="stat-label">Awaiting Payment</div><div class="stat-value">${fmtMoney(receivableValue)}</div><div class="stat-sub">${receivable.length} order${receivable.length!==1?'s':''}</div></div>
  </div>

  <div class="dash-grid">
    <div class="panel">
      <div class="panel-title">Pipeline Funnel</div>
      ${funnelBars.map(b=>`<div class="bar-row"><div class="bar-label">${b.label}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round((b.count/maxCount)*100)}%;background:${b.color}"></div></div><div class="bar-value">${b.count}</div></div>`).join('')}
      <div class="panel-title" style="margin-top:22px;">Orders — Action Needed</div>
      ${actionNeeded.length ? actionNeeded.map(o=>`
        <div class="task-row" data-action="open-opportunity" data-id="${o.id}" style="cursor:pointer">
          <div class="task-title">${esc(o.projectName||o.itemProduct||'Order')}<div class="sub-text">${esc(customerName(o.customerId))}</div></div>
          ${o.lcStatus==='pending' ? '<span class="badge badge-amber">LC pending</span>' : ''}
          ${o.shipmentStatus==='pending' ? '<span class="badge badge-amber">Shipment pending</span>' : ''}
        </div>`).join('') : `<div class="sub-text">Nothing pending — all orders are clear 🎉</div>`}
    </div>
    <div class="panel">
      <div class="panel-title">Upcoming Tasks</div>
      ${upcomingTasks.length ? upcomingTasks.map(t=>`
        <div class="task-row">
          <input type="checkbox" data-action="toggle-task" data-id="${t.id}" ${t.done?'checked':''}>
          <div class="task-title">${esc(t.title)}<div class="sub-text">${t.contactId?contactName(t.contactId):(t.opportunityId?opportunityLabel(t.opportunityId):'')}</div></div>
          <span class="badge ${t.dueDate && t.dueDate<Date.now() ? 'badge-red':'badge-gray'}">${fmtDate(t.dueDate)}</span>
        </div>`).join('') : `<div class="sub-text">No upcoming tasks 🎉</div>`}
      <div class="panel-title" style="margin-top:22px;">Recent Activity</div>
      ${recentActivities.length ? recentActivities.map(a=>`
        <div class="activity-item"><div class="activity-dot"></div>
          <div><div><b>${a.contactId?contactName(a.contactId):opportunityLabel(a.opportunityId)}</b> — ${esc(a.note)}</div><div class="activity-time">${activityIcon(a.type)} ${a.type} · ${fmtDate(a.timestamp)}</div></div>
        </div>`).join('') : `<div class="sub-text">No activity yet</div>`}
    </div>
  </div>
  `;
}
function activityIcon(type){ return {call:'📞',email:'✉️',meeting:'🗓️',note:'📝'}[type] || '•'; }

/* ---------------- Tasks ---------------- */
function renderTasks(){
  const sorted = [...state.tasks].sort((a,b)=>{ if(a.done !== b.done) return a.done ? 1 : -1; return (a.dueDate||0) - (b.dueDate||0); });
  return `
  <div class="page-header">
    <div><h1 class="page-title">Tasks</h1><div class="page-subtitle">${state.tasks.filter(t=>!t.done).length} open</div></div>
    <button class="btn" data-action="new-task">+ New Task</button>
  </div>
  <div class="panel">
    ${sorted.length ? sorted.map(t=>`
      <div class="task-row ${t.done?'done':''}">
        <input type="checkbox" data-action="toggle-task" data-id="${t.id}" ${t.done?'checked':''}>
        <div class="task-title" data-action="open-task" data-id="${t.id}" style="cursor:pointer">
          ${esc(t.title)}
          <div class="sub-text">${t.contactId?contactName(t.contactId):''}${t.contactId&&t.opportunityId?' · ':''}${t.opportunityId?opportunityLabel(t.opportunityId):''}</div>
        </div>
        <span class="badge ${!t.done && t.dueDate && t.dueDate<Date.now() ? 'badge-red':'badge-gray'}">${fmtDate(t.dueDate)}</span>
        <button class="icon-btn" data-action="delete-task" data-id="${t.id}">🗑️</button>
      </div>`).join('') : `<div class="empty-state"><div class="empty-state-icon">✅</div>No tasks yet</div>`}
  </div>
  `;
}

/* ---------------- Modals ---------------- */
function customerOptions(selectedId){ return `<option value="">—</option>` + state.customers.map(c=>`<option value="${c.id}" ${c.id===selectedId?'selected':''}>${esc(c.name)}</option>`).join(''); }
function principalOptions(selectedId){ return `<option value="">—</option>` + state.principals.map(p=>`<option value="${p.id}" ${p.id===selectedId?'selected':''}>${esc(p.name)}</option>`).join(''); }
function contactOptions(selectedId){ return `<option value="">—</option>` + state.contacts.map(c=>`<option value="${c.id}" ${c.id===selectedId?'selected':''}>${esc(c.name)}</option>`).join(''); }
function opportunityOptions(selectedId){ return `<option value="">—</option>` + state.opportunities.map(o=>`<option value="${o.id}" ${o.id===selectedId?'selected':''}>${esc(o.projectName||o.opportunityNumber||'Untitled')}</option>`).join(''); }

function renderModal(){
  const {type} = modal;
  if(type==='customer-form') return renderCustomerForm();
  if(type==='principal-form') return renderPrincipalForm();
  if(type==='contact-form') return renderContactForm();
  if(type==='opportunity-form') return renderOpportunityForm();
  if(type==='task-form') return renderTaskForm();
  return '';
}

function modalShell(title, bodyHtml, footerHtml, wide){
  return `
  <div class="modal-backdrop" data-action="close-modal">
    <div class="modal" style="${wide?'max-width:680px;':''}" onclick="event.stopPropagation()">
      <div class="modal-header"><h3>${title}</h3><button class="close-x" data-action="close-modal">✕</button></div>
      <div class="modal-body">${bodyHtml}</div>
      ${footerHtml ? `<div class="modal-footer">${footerHtml}</div>` : ''}
    </div>
  </div>`;
}

      <select name="type" style="max-width:110px"><option value="call">📞 Call</option><option value="email">✉️ Email</option><option value="meeting">🗓️ Meeting</option><option value="note">📝 Note</option></select>
      <input name="note" placeholder="What happened?" required>
      <button class="btn btn-sm" data-action="add-opportunity-activity" data-id="${editing.id}" type="submit">Add</button>
    </form>
    <div class="detail-section" style="margin-top:14px;">
      <div class="detail-label">Activity Timeline</div>
      ${acts.length ? acts.map(a=>`<div class="activity-item"><div class="activity-dot"></div><div><div>${esc(a.note)}</div><div class="activity-time">${activityIcon(a.type)} ${a.type} · ${fmtDate(a.timestamp)}</div></div></div>`).join('') : `<div class="sub-text">No activity logged yet.</div>`}
    </div>

  `, `
    <div>${editing?`<button class="btn btn-danger" data-action="delete-opportunity" data-id="${editing.id}">Delete</button>`:''}</div>
    <div class="modal-footer-right">
      ${editing && isLead ? `<button class="btn btn-secondary" data-action="promote-lead" data-id="${editing.id}">Promote to RFQ →</button>` : ''}
      <button class="btn btn-secondary" data-action="close-modal">Cancel</button>
      <button class="btn" data-action="save-opportunity" data-id="${editing?editing.id:''}" data-stage="${o.pipelineStage}">Save</button>
    </div>
  `, true);
}

/* ---------------- Event handling ---------------- */
function attachGlobalHandlers(){
  const app = document.getElementById('app');

  app.querySelectorAll('[data-nav]').forEach(el=>{ el.addEventListener('click', ()=>{ view = el.dataset.nav; searchQuery=''; modal=null; render(); }); });
  app.querySelectorAll('[data-action="search"]').forEach(el=>{ el.addEventListener('input', ()=>{ searchQuery = el.value; render(); restoreFocus(el); }); });

  bind('sign-out', async ()=>{ await sb.auth.signOut(); });

  bind('new-customer', ()=>{ modal={type:'customer-form', id:null}; render(); });
  bind('new-principal', ()=>{ modal={type:'principal-form', id:null}; render(); });
  bind('new-contact', ()=>{ modal={type:'contact-form', id:null}; render(); });
  bind('new-opportunity', ()=>{ modal={type:'opportunity-form', id:null, startStage:'rfq'}; render(); });
  bind('new-lead', ()=>{ modal={type:'opportunity-form', id:null, startStage:'lead'}; render(); });
  bind('new-task', ()=>{ modal={type:'task-form', id:null}; render(); });

  bind('open-customer', (el)=>{ modal={type:'customer-form', id:el.dataset.id}; render(); });
  bind('open-principal', (el)=>{ modal={type:'principal-form', id:el.dataset.id}; render(); });
  bind('open-contact', (el)=>{ modal={type:'contact-form', id:el.dataset.id}; render(); });
  bind('open-opportunity', (el)=>{ modal={type:'opportunity-form', id:el.dataset.id}; render(); });
  bind('open-task', (el)=>{ modal={type:'task-form', id:el.dataset.id}; render(); });

  bind('close-modal', ()=>{ modal=null; render(); });

  bind('promote-lead', async (el)=>{
    const id = el.dataset.id;
    const payload = {pipeline_stage:'rfq', rfq_status:'not_started'};
    const {data, error} = await sb.from('opportunities').update(payload).eq('id', id).select().single();
    if(error){ toast('Error: '+error.message); return; }
    upsertLocal('opportunities', mapOpportunityFromDb(data));
    modal=null; render(); toast('Promoted to RFQ');
  });

  bind('delete-customer', async (el)=>{
    if(!confirm('Delete this customer? Related contacts and opportunities will be unlinked.')) return;
    const id = el.dataset.id;
    const {error} = await sb.from('customers').delete().eq('id', id);
    if(error){ toast('Error: '+error.message); return; }
    removeLocal('customers', id); modal=null; render(); toast('Customer deleted');
  });
  bind('delete-principal', async (el)=>{
    if(!confirm('Delete this principal?')) return;
    const id = el.dataset.id;
    const {error} = await sb.from('principals').delete().eq('id', id);
    if(error){ toast('Error: '+error.message); return; }
    removeLocal('principals', id); modal=null; render(); toast('Principal deleted');
  });
  bind('delete-contact', async (el)=>{
    if(!confirm('Delete this contact?')) return;
    const id = el.dataset.id;
    const {error} = await sb.from('contacts').delete().eq('id', id);
    if(error){ toast('Error: '+error.message); return; }
    removeLocal('contacts', id); modal=null; render(); toast('Contact deleted');
  });
  bind('delete-opportunity', async (el)=>{
    if(!confirm('Delete this record?')) return;
    const id = el.dataset.id;
    const {error} = await sb.from('opportunities').delete().eq('id', id);
    if(error){ toast('Error: '+error.message); return; }
    removeLocal('opportunities', id); modal=null; render(); toast('Deleted');
  });
  bind('delete-task', async (el)=>{
    const id = el.dataset.id;
    const {error} = await sb.from('tasks').delete().eq('id', id);
    if(error){ toast('Error: '+error.message); return; }
    removeLocal('tasks', id); modal=null; render(); toast('Task deleted');
  });

  bind('toggle-task', async (el)=>{
    const id = el.dataset.id; const done = el.checked;
    const {data, error} = await sb.from('tasks').update({done}).eq('id', id).select().single();
    if(error){ toast('Error: '+error.message); return; }
    upsertLocal('tasks', mapTaskFromDb(data)); render();
  }, 'change');

  bind('save-customer', async (el)=>{
    const form = document.getElementById('customer-form');
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const id = el.dataset.id;
    const payload = {name:fd.get('name').trim(), industry:fd.get('industry').trim()||null, website:fd.get('website').trim()||null, notes:fd.get('notes').trim()||null};
    const q = id ? sb.from('customers').update(payload).eq('id', id) : sb.from('customers').insert(payload);
    const {data, error} = await q.select().single();
    if(error){ toast('Error: '+error.message); return; }
    upsertLocal('customers', mapCustomerFromDb(data));
    modal=null; render(); toast('Customer saved');
  });

  bind('save-principal', async (el)=>{
    const form = document.getElementById('principal-form');
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const id = el.dataset.id;
    const payload = {name:fd.get('name').trim(), notes:fd.get('notes').trim()||null};
    const q = id ? sb.from('principals').update(payload).eq('id', id) : sb.from('principals').insert(payload);
    const {data, error} = await q.select().single();
    if(error){ toast('Error: '+error.message); return; }
    upsertLocal('principals', mapPrincipalFromDb(data));
    modal=null; render(); toast('Principal saved');
  });

  bind('save-contact', async (el)=>{
    const form = document.getElementById('contact-form');
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const id = el.dataset.id;
    const payload = {name:fd.get('name').trim(), email:fd.get('email').trim()||null, phone:fd.get('phone').trim()||null, title:fd.get('title').trim()||null, customer_id:fd.get('customerId')||null, notes:fd.get('notes').trim()||null};
    const q = id ? sb.from('contacts').update(payload).eq('id', id) : sb.from('contacts').insert(payload);
    const {data, error} = await q.select().single();
    if(error){ toast('Error: '+error.message); return; }
    upsertLocal('contacts', mapContactFromDb(data));
    modal=null; render(); toast('Contact saved');
  });

  bind('save-task', async (el)=>{
    const form = document.getElementById('task-form');
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const id = el.dataset.id;
    const payload = {title:fd.get('title').trim(), due_date: fd.get('dueDate') || null, contact_id:fd.get('contactId')||null, opportunity_id:fd.get('opportunityId')||null, notes:fd.get('notes').trim()||null};
    const q = id ? sb.from('tasks').update(payload).eq('id', id) : sb.from('tasks').insert(payload);
    const {data, error} = await q.select().single();
    if(error){ toast('Error: '+error.message); return; }
    upsertLocal('tasks', mapTaskFromDb(data));
    modal=null; render(); toast('Task saved');
  });

  bind('save-opportunity', async (el)=>{
    const form = document.getElementById('opportunity-form');
    if(!form.reportValidity()) return;
    const fd = new FormData(form);
    const id = el.dataset.id;
    const stage = el.dataset.stage;
    const payload = {
      pipeline_stage: stage,
      customer_id: fd.get('customerId')||null,
      project_name: fd.get('projectName').trim()||null,
      item_product: fd.get('itemProduct').trim()||null,
      assigned_to: fd.get('assignedTo')||null,
      notes: fd.get('notes').trim()||null,
    };
    if(stage === 'lead'){
      payload.lead_source = fd.get('leadSource')||null;
      payload.lead_score = fd.get('leadScore') ? Number(fd.get('leadScore')) : null;
      payload.lead_status = fd.get('leadStatus');
    } else {
      payload.opportunity_type = fd.get('opportunityType')||null;
      payload.opportunity_number = fd.get('opportunityNumber').trim()||null;
      payload.rfq_number = fd.get('rfqNumber').trim()||null;
      payload.rfq_date = fd.get('rfqDate')||null;
      payload.rfq_date_estimated = fd.get('rfqDateEstimated')==='on';
      payload.oem_reference_number = fd.get('oemReferenceNumber').trim()||null;
      payload.priority = fd.get('priority')||null;
      payload.follow_up_action = fd.get('followUpAction')||null;
      payload.contact_method = fd.get('contactMethod').trim()||null;
      payload.win_lose = fd.get('winLose');
      payload.lose_reason = fd.get('loseReason').trim()||null;
      if(stage !== 'order'){
        payload.rfq_status = fd.get('rfqStatus');
        // Winning an RFQ promotes it straight to Orders & POs
        if(payload.win_lose === 'won'){ payload.pipeline_stage = 'order'; }
      }
      if(stage === 'order' || payload.pipeline_stage === 'order'){
        payload.ctr_number = fd.get('ctrNumber').trim()||null;
        payload.po_number = fd.get('poNumber').trim()||null;
        payload.po_date = fd.get('poDate')||null;
        payload.po_date_estimated = fd.get('poDateEstimated')==='on';
        payload.currency = fd.get('currency')||null;
        payload.po_value = fd.get('poValue') ? Number(fd.get('poValue')) : null;
        payload.payment_terms = fd.get('paymentTerms')||null;
        payload.po_principal_id = fd.get('poPrincipalId')||null;
        payload.lc_status = fd.get('lcStatus') || 'pending';
        payload.shipment_status = fd.get('shipmentStatus') || 'pending';
        payload.sale_date = fd.get('saleDate')||null;
        payload.payment_status = fd.get('paymentStatus') || 'receivable';
        payload.commission_status = fd.get('commissionStatus')||null;
        payload.commission_rate = fd.get('commissionRate') ? Number(fd.get('commissionRate')) : null;
      }
    }
    const q = id ? sb.from('opportunities').update(payload).eq('id', id) : sb.from('opportunities').insert(payload);
    const {data, error} = await q.select().single();
    if(error){ toast('Error: '+error.message); return; }
    const savedOpp = mapOpportunityFromDb(data);
    upsertLocal('opportunities', savedOpp);

    if(form.principalIds){
      const principalIds = Array.from(form.principalIds.selectedOptions).map(o=>o.value);
      await sb.from('opportunity_principals').delete().eq('opportunity_id', savedOpp.id);
      if(principalIds.length){ await sb.from('opportunity_principals').insert(principalIds.map(pid=>({opportunity_id:savedOpp.id, principal_id:pid}))); }
      await reloadOpportunityPrincipals();
    }

    modal=null; render(); toast(payload.pipeline_stage==='order' && stage!=='order' ? 'Won! Moved to Orders & POs' : 'Saved');
  });

  bind('add-opportunity-activity', async (el)=>{
    const form = document.getElementById('activity-form');
    const fd = new FormData(form);
    const note = fd.get('note').trim();
    if(!note) return;
    const payload = {opportunity_id:el.dataset.id, type:fd.get('type'), note, created_by: session.user.id};
    const {data, error} = await sb.from('activities').insert(payload).select().single();
    if(error){ toast('Error: '+error.message); return; }
    upsertLocal('activities', mapActivityFromDb(data));
    render();
  }, 'submit', true);

  /* Kanban drag & drop, shared across Leads / RFQ / Payment boards */
  app.querySelectorAll('.kanban-card').forEach(card=>{
    card.addEventListener('dragstart', ()=>{ dragCardId = card.dataset.id; card.classList.add('dragging'); });
    card.addEventListener('dragend', ()=>{ card.classList.remove('dragging'); });
  });
  app.querySelectorAll('.kanban-col-body').forEach(col=>{
    col.addEventListener('dragover', (e)=>{ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', ()=>{ col.classList.remove('drag-over'); });
    col.addEventListener('drop', async (e)=>{
      e.preventDefault(); col.classList.remove('drag-over');
      const board = col.dataset.board; const colId = col.dataset.col;
      const opp = state.opportunities.find(o=>o.id===dragCardId);
      if(!opp) return;
      let payload = null;
      if(board==='leads' && opp.leadStatus!==colId){ payload = {lead_status:colId}; }
      else if(board==='rfq'){
        if(colId==='won'){ payload = {win_lose:'won', pipeline_stage:'order'}; }
        else if(colId==='not_interested'){ payload = {rfq_status:'not_interested', win_lose:'lost'}; }
        else if(opp.rfqStatus!==colId || opp.winLose!=='pending'){ payload = {rfq_status:colId, win_lose:'pending'}; }
      }
      else if(board==='payment' && opp.paymentStatus!==colId){ payload = {payment_status:colId}; }
      if(!payload) return;
      Object.assign(opp, board==='leads'?{leadStatus:colId}:(board==='rfq'?{rfqStatus:colId}:{paymentStatus:colId}));
      render();
      const {data, error} = await sb.from('opportunities').update(payload).eq('id', dragCardId).select().single();
      if(error){ toast('Error: '+error.message); return; }
      upsertLocal('opportunities', mapOpportunityFromDb(data)); render();
    });
  });
}

function bind(action, handler, eventType='click', preventDefault){
  document.querySelectorAll(`[data-action="${action}"]`).forEach(el=>{
    el.addEventListener(eventType, (e)=>{
      if(preventDefault) e.preventDefault();
      if(eventType==='click') e.stopPropagation();
      handler(el, e);
    });
  });
}
function restoreFocus(el){ const val = el.value; el.focus(); el.setSelectionRange(val.length, val.length); }

render();
</script>
</body>
</html>
